name: uis8581a-kernel-rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kernel-ci-\${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  KCFLAGS: -Wno-error
  KBUILD_BUILD_USER: uis8581a
  KBUILD_BUILD_HOST: gh-ci

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make gcc-aarch64-linux-gnu \
            device-tree-compiler ccache libyaml-dev
          test -f /usr/include/yaml.h || sudo apt-get install -y libyaml-dev

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-kernel
          max-size: 2G

      - name: Clone linux-sprd
        run: git clone --depth 1 https://github.com/strongtz/linux-sprd source

      - name: Clone module sources
        run: |
          mkdir -p source/drivers/vendor/common/touchscreen_v2
          mkdir -p source/drivers/misc/sprdwcn/platform
          git clone --depth 1 https://github.com/kanadenadi/android_kernel_sprd_sc9832e /tmp/k
          git clone --depth 1 https://github.com/Yazz246/Aether_Kernel-A665L /tmp/a
          git clone --depth 1 https://github.com/Hadenix/android_kernel_zte_sc9863a /tmp/z
          cp -a /tmp/k/drivers/misc/sprdwcn_bsp source/drivers/unisoc_platform/
          cp -a /tmp/a/drivers/unisoc_platform/wlan source/drivers/unisoc_platform/
          cp -a /tmp/a/drivers/vendor/common/touchscreen_v2/hxchipset_v3_3 source/drivers/vendor/common/touchscreen_v2/
          cp -a /tmp/z/drivers/misc/sprd_camera source/drivers/misc/
          cp -a /tmp/a/drivers/unisoc_platform/sprdwcn/include/*.h source/drivers/misc/sprdwcn/include/
          cp -a /tmp/a/drivers/unisoc_platform/sprdwcn/sdio/sdiohal.h source/drivers/misc/sprdwcn/platform/
          cp -a /tmp/a/drivers/unisoc_platform/sprdwcn/include/sprd_wcn.h source/drivers/misc/sprdwcn/platform/

      - name: Patch
        run: |
          cd source
          chmod +x arch/arm64/kernel/vdso/gen_vdso_offsets.sh
          chmod +x scripts/ld-version.sh scripts/config
          sed -i '/^HOST_EXTRACFLAGS := /s/$/ -fcommon/' scripts/dtc/Makefile
          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/' scripts/dtc/Makefile
          grep -q 'WCN_BOUND_XO_MODE' drivers/misc/sprdwcn/include/umw2653_glb.h && printf '#define WCN_BOUND_XO_MODE BIT(15)\n' >> drivers/misc/sprdwcn/include/umw2653_glb.h || true
          mkdir -p include/generated
          echo '#define vdso_offset_sigtramp 0x0648' > include/generated/vdso-offsets.h
          # Copy temp WCN files (must happen before patching wcn_glb.h)
          cp -a drivers/misc/sprdwcn_temp/platform drivers/misc/sprdwcn_temp/include drivers/misc/sprdwcn/ 2>/dev/null || true
          cp -a drivers/misc/sprdwcn_temp/Makefile drivers/misc/sprdwcn/ 2>/dev/null || true
          # Fix sprd_dfs_trace.h: comment out TRACE_INCLUDE_PATH + create include symlink
          sed -i '/^#define TRACE_INCLUDE_PATH \./s/^/#define TRACE_INCLUDE_PATH_KILLED\n\/\//' drivers/devfreq/sprd/sprd_dfs_trace.h
          mkdir -p include/trace
          mkdir -p include/trace/events
          ln -sf ../../../drivers/devfreq/sprd/sprd_dfs_trace.h include/trace/events/sprd_dfs_trace.h
          # Fix platform/wcn_glb.h missing (strongtz/linux-sprd lacks it)
          cp ../patches/wcn_platform_wcn_glb.h drivers/misc/sprdwcn/platform/wcn_glb.h
          # Ensure include/wcn_glb.h has UMW2653 support (temp copy may clobber it)
          python3 ../patches/fix_wcn_glb.py drivers/misc/sprdwcn/include/wcn_glb.h
          # DEBUG: identify which wcn_glb.h gets included
          sed -i '1i #pragma message "USING include/wcn_glb.h"' drivers/misc/sprdwcn/include/wcn_glb.h
          sed -i '1i #pragma message "USING platform/wcn_glb.h"' drivers/misc/sprdwcn/platform/wcn_glb.h
          # DEBUG: prove CONFIG_UMW2653 block is entered
          sed -i '/#ifdef CONFIG_UMW2653/a #pragma message "UMW2653 block active"' drivers/misc/sprdwcn/include/wcn_glb.h

      - name: Configure
        run: |
          cp artifacts/running.config source/.config
          make -C source ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" olddefconfig
          grep "UMW2653" source/.config || true
          cat source/drivers/misc/sprdwcn/platform/wcn_glb.h || true

      - name: Build
        run: make -C source -j$(nproc) ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" KCFLAGS="-Wno-error" Image dtbs

      - name: Modules
        run: |
          cd source
          for d in \
            drivers/unisoc_platform/wlan/marlin3_sipc \
            drivers/unisoc_platform/sprdwcn_bsp/sipc_modules/bluetooth/driver \
            drivers/unisoc_platform/sprdwcn_bsp/sipc_modules/fm/driver \
            drivers/misc/sprd_camera/cpp/lite_r4p0 \
            drivers/misc/sprd_camera/flash
          do
            echo "=== $d ==="
            E=""
            case $d in *bluetooth*|*fm*) E="BSP_BOARD_UNISOC_WCN_SOCKET=sipc";; esac
            make -j$(nproc) ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" M=$d $E modules
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uis8581a-build
          path: |
            source/arch/arm64/boot/Image
            source/arch/arm64/boot/dts/sprd/*.dtb
            source/.config
            source/drivers/**/*.ko
          retention-days: 90
